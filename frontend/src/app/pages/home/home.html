<div class="bg-gray-900 min-h-screen">
  <!-- Hero Section -->
  <section class="bg-gradient-to-b from-gray-800 to-gray-900 py-8 sm:py-12 lg:py-16">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <!-- Titolo Hero -->
      <div class="text-center mb-8 sm:mb-12">
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-3 sm:mb-4">
          Benvenuto al Meme Museum
        </h1>
        <p class="text-gray-400 text-base sm:text-lg">
          Scopri i meme più divertenti del web
        </p>
      </div>

      <!-- Search Bar -->
      <app-search-bar (search)="onSearch($event)"></app-search-bar>

      <!-- Meme del Giorno -->
      <div class="max-w-2xl mx-auto px-4 sm:px-0">
        <ng-container *ngIf="dailyMeme; else noMeme">
          <app-meme-card
            [id]="dailyMeme.id"
            [imagePath]="dailyMeme.imagePath"
            [title]="dailyMeme.title"
            [author]="dailyMeme.author"
            [upvotes]="dailyMeme.upvotes"
            [downvotes]="dailyMeme.downvotes"
            [isDaily]="dailyMeme.isDaily"
            [tags]="dailyMeme.tags">
          </app-meme-card>
        </ng-container>

        <ng-template #noMeme>
          <div class="bg-gray-800 border-2 border-dashed border-gray-700 rounded-xl p-8 sm:p-12 text-center">
            <div class="text-4xl sm:text-5xl mb-3 sm:mb-4">🖼️</div>
            <h3 class="text-lg sm:text-xl font-semibold text-white mb-2">Ancora nulla per oggi!</h3>
            <p class="text-sm sm:text-base text-gray-400">
              Non sono ancora stati caricati meme oggi. Sii il primo a scriverne la storia!
            </p>
          </div>
        </ng-template>
      </div>
    </div>
  </section>

  <section class="py-8 sm:py-12 bg-gray-900">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center">
        <h2 class="text-2xl sm:text-3xl font-bold text-white mb-3 sm:mb-4">
          Esplora il Museo
        </h2>
        <p class="text-sm sm:text-base text-gray-400 mb-6 sm:mb-8">
          Usa la barra di ricerca per trovare i tuoi meme preferiti
        </p>
      </div>
    </div>
  </section>
</div>
