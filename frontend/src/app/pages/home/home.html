<div class="bg-gray-900 min-h-screen">
  <!-- Hero Section -->
  <section class="bg-gradient-to-b from-gray-800 to-gray-900 py-16">
    <div class="container mx-auto px-4">
      <!-- Titolo Hero -->
      <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">
          Benvenuto al Meme Museum
        </h1>
        <p class="text-gray-400 text-lg">
          Scopri i meme più divertenti del web
        </p>
      </div>

      <!-- Search Bar -->
      <div class="max-w-2xl mx-auto mb-16">
        <form (ngSubmit)="onSearch()" class="flex gap-2">
          <div class="flex-grow relative">
            <input 
              type="text" 
              [(ngModel)]="searchQuery"
              name="search"
              placeholder="Cerca meme per titolo, autore o tag..."
              class="w-full px-6 py-4 bg-gray-800 text-white rounded-lg border border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all duration-200 placeholder-gray-500">
            <svg class="absolute right-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <button 
            type="submit"
            class="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors duration-200 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            Cerca
          </button>
        </form>
      </div>

      <!-- Meme del Giorno -->
      <div class="max-w-2xl mx-auto">
        <ng-container *ngIf="dailyMeme">
          <app-meme-card
            [imagePath]="dailyMeme.imagePath"
            [title]="dailyMeme.title"
            [author]="dailyMeme.author"
            [upvotes]="dailyMeme.upvotes"
            [downvotes]="dailyMeme.downvotes"
            [isDaily]="dailyMeme.isDaily">
          </app-meme-card>
        </ng-container>
      </div>
    </div>
  </section>

  <!-- Sezione aggiuntiva (opzionale - puoi rimuoverla o personalizzarla) -->
  <section class="py-12 bg-gray-900">
    <div class="container mx-auto px-4">
      <div class="text-center">
        <h2 class="text-3xl font-bold text-white mb-4">
          Esplora il Museo
        </h2>
        <p class="text-gray-400 mb-8">
          Usa la barra di ricerca per trovare i tuoi meme preferiti
        </p>
      </div>
    </div>
  </section>
</div>
