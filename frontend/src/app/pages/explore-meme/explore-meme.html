<div class="bg-gray-900 min-h-screen p-8">
  <app-search-bar (search)="onNewSearch($event)"></app-search-bar>

  <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 mt-4">
    <h2 class="text-white text-xl font-bold">
      Esplora i Meme 
      <span class="text-gray-500 text-sm ml-2">({{ allResults.length }} totali)</span>
    </h2>

    <div class="mt-4 md:mt-0">
      <label class="text-gray-400 text-sm mr-2">Ordina per:</label>
      <select 
        (change)="onSortChange($event)"
        class="bg-gray-800 text-white border border-gray-700 rounded px-3 py-1 focus:outline-none focus:border-blue-500">
        <option value="newest">Più recenti</option>
        <option value="oldest">Meno recenti</option>
        <option value="upvotes">Più Upvoted</option>
        <option value="downvotes">Più Downvoted</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
    <app-meme-preview 
      *ngFor="let meme of pagedResults"
      [id]="meme.id"
      [title]="meme.titolo"
      [author]="meme.autore.username || 'Anonimo'"
      [imagePath]="'http://localhost:3000/' + meme.pathRelativo"
      [upvotes]="meme.upvotes"
      [downvotes]="meme.downvotes">
    </app-meme-preview>
  </div>

  <div *ngIf="allResults.length === 0" class="text-center py-20">
    <p class="text-gray-500">Nessun meme disponibile al momento.</p>
  </div>

  <div class="flex justify-center items-center gap-4 mt-12" *ngIf="totalPages > 1">
    <button (click)="changePage(currentPage - 1)" 
            [disabled]="currentPage === 1"
            class="px-4 py-2 bg-gray-800 text-white rounded disabled:opacity-50 hover:bg-gray-700 transition-colors">
      Precedente
    </button>
    
    <span class="text-gray-400 font-medium">Pagina {{ currentPage }} di {{ totalPages }}</span>

    <button (click)="changePage(currentPage + 1)" 
            [disabled]="currentPage === totalPages"
            class="px-4 py-2 bg-gray-800 text-white rounded disabled:opacity-50 hover:bg-gray-700 transition-colors">
      Successiva
    </button>
  </div>
</div>
