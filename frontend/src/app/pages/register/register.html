<div class="bg-gray-900 min-h-screen flex items-center justify-center py-8 sm:py-12 px-4 sm:px-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-6 sm:mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">
        Unisciti al Museum
      </h1>
      <p class="text-sm sm:text-base text-gray-400">
        Crea il tuo account e inizia a condividere meme
      </p>
    </div>

    <div class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl shadow-2xl border border-gray-700 p-6 sm:p-8">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="mb-5 sm:mb-6">
          <label for="username" class="block text-sm font-semibold text-gray-300 mb-2">
            Username
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input
              type="text"
              id="username"
              formControlName="username"
              class="block w-full pl-10 pr-3 py-2.5 sm:py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 text-sm sm:text-base"
              placeholder="Scegli un username"
            />
          </div>
          <div *ngIf="username?.touched && username?.invalid" class="mt-1 text-xs text-red-400">
            <span *ngIf="username?.errors?.['required']">L'username è obbligatorio</span>
            <span *ngIf="username?.errors?.['minlength']">Minimo 3 caratteri</span>
            <span *ngIf="username?.errors?.['pattern']">Usa solo lettere, numeri, _ o -</span>
          </div>
        </div>

        <div class="mb-5 sm:mb-6">
          <label for="email" class="block text-sm font-semibold text-gray-300 mb-2">
            Email
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="block w-full pl-10 pr-3 py-2.5 sm:py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 text-sm sm:text-base"
              placeholder="nome@esempio.com"
            />
          </div>
          <div *ngIf="email?.touched && email?.invalid" class="mt-1 text-xs text-red-400">
            <span *ngIf="email?.errors?.['required']">L'email è obbligatoria</span>
            <span *ngIf="email?.errors?.['email']">Inserisci un'email valida</span>
          </div>
        </div>

        <div class="mb-6 sm:mb-8">
          <label for="password" class="block text-sm font-semibold text-gray-300 mb-2">
            Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              class="block w-full pl-10 pr-10 py-2.5 sm:py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 text-sm sm:text-base"
              placeholder="••••••••"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-300 focus:outline-none"
            >
              <svg *ngIf="!showPassword" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showPassword" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
          <div *ngIf="password?.touched && password?.invalid" class="mt-1 text-xs text-red-400">
            <span *ngIf="password?.errors?.['required']">La password è obbligatoria</span>
            <span *ngIf="password?.errors?.['minlength']">Minimo 6 caratteri</span>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="registerForm.invalid"
          class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed text-white font-bold py-2.5 sm:py-3 px-4 rounded-lg transition duration-200 transform hover:scale-105 active:scale-95 flex items-center justify-center text-sm sm:text-base mb-4"
        >
          <span>Registrati</span>
        </button>
      </form>

      <div class="relative my-5 sm:my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-700"></div>
        </div>
        <div class="relative flex justify-center text-xs sm:text-sm">
          <span class="px-4 bg-gradient-to-br from-gray-800 to-gray-900 text-gray-400">
            Hai già un account?
          </span>
        </div>
      </div>

      <div class="text-center">
        <a routerLink="/login" class="text-sm sm:text-base font-semibold text-blue-400 hover:text-blue-300 transition duration-200">
          Accedi ora
        </a>
      </div>
    </div>
  </div>
</div>
