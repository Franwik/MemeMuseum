<div class="bg-gray-900 min-h-screen p-4 sm:p-6 lg:p-8">
  <app-search-bar (search)="onNewSearch($event)"></app-search-bar>

  <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 sm:mb-8 mt-4 gap-4">
    <h2 class="text-white text-base sm:text-xl break-words">
      Risultati
      <span *ngIf="lastQuery" class="block sm:inline"> per: <span class="text-blue-400">"{{ lastQuery }}"</span></span>
      <span *ngIf="lastDate" class="block sm:inline"> del: <span class="text-blue-400">{{ lastDate | date:'dd/MM/yyyy' }}</span></span>
      <span class="text-gray-500 text-sm ml-0 sm:ml-2 block sm:inline" [attr.data-testid]="'results-count'">({{ allResults.length }} trovati)</span>
    </h2>

    <div class="flex items-center">
      <label class="text-gray-400 text-xs sm:text-sm mr-2">Ordina per:</label>
      <select 
        (change)="onSortChange($event)"
        class="bg-gray-800 text-white border border-gray-700 rounded px-2 sm:px-3 py-1 focus:outline-none focus:border-blue-500 text-xs sm:text-sm">
        <option value="newest">Più recenti</option>
        <option value="oldest">Meno recenti</option>
        <option value="upvotes">Più Upvoted</option>
        <option value="downvotes">Più Downvoted</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
    <app-meme-preview 
      *ngFor="let meme of pagedResults"
      [id]="meme.id"
      [title]="meme.titolo"
      [author]="meme.autore.username"
      [imagePath]="'http://localhost:3000/' + meme.pathRelativo"
      [upvotes]="meme.upvotes"
      [downvotes]="meme.downvotes"
      [tags]="meme.tags || []">
    </app-meme-preview>
  </div>

  <div *ngIf="allResults.length === 0" class="text-center py-16 sm:py-20">
    <p class="text-sm sm:text-base text-gray-500">Nessun meme trovato per questa ricerca.</p>
  </div>

  <div class="flex flex-col sm:flex-row justify-center items-center gap-3 sm:gap-4 mt-8 sm:mt-12" *ngIf="totalPages > 1">
    <button (click)="changePage(currentPage - 1)" 
            [disabled]="currentPage === 1"
            class="w-full sm:w-auto px-4 py-2 bg-gray-800 text-white rounded disabled:opacity-50 hover:bg-gray-700 transition-colors text-sm sm:text-base">
      Precedente
    </button>
    
    <span class="text-gray-400 font-medium text-sm sm:text-base">Pagina {{ currentPage }} di {{ totalPages }}</span>

    <button (click)="changePage(currentPage + 1)" 
            [disabled]="currentPage === totalPages"
            class="w-full sm:w-auto px-4 py-2 bg-gray-800 text-white rounded disabled:opacity-50 hover:bg-gray-700 transition-colors text-sm sm:text-base">
      Successiva
    </button>
  </div>
</div>
