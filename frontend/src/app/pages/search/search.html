<div class="bg-gray-900 min-h-screen p-8">
  <app-search-bar (search)="onNewSearch($event)"></app-search-bar>

  <h2 class="text-white text-xl mb-8 mt-4">
    Risultati per: <span class="text-blue-400">"{{ lastQuery }}"</span>
  </h2>

  <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
    <app-meme-preview 
      *ngFor="let meme of results"
      [id]="meme.id"
      [title]="meme.titolo"
      [author]="meme.autore?.username"
      [imagePath]="'http://localhost:3000/' + meme.pathRelativo"
      [upvotes]="meme.upvotes">
    </app-meme-preview>
  </div>

  <div class="flex justify-center items-center gap-4 mt-12" *ngIf="totalPages > 1">
    <button (click)="changePage(currentPage - 1)" 
            [disabled]="currentPage === 1"
            class="px-4 py-2 bg-gray-800 text-white rounded disabled:opacity-50">
      Precedente
    </button>
    
    <span class="text-gray-400">Pagina {{ currentPage }} di {{ totalPages }}</span>

    <button (click)="changePage(currentPage + 1)" 
            [disabled]="currentPage === totalPages"
            class="px-4 py-2 bg-gray-800 text-white rounded disabled:opacity-50">
      Successiva
    </button>
  </div>
</div>
