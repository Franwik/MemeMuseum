<div class="min-h-screen bg-gray-900 text-white p-6">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-8 text-center">Crea un Nuovo Meme</h1>

    <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-2xl">
      
      <!-- Alert di successo -->
      <div *ngIf="uploadSuccess" class="mb-6 p-4 bg-green-600/20 border border-green-600 rounded-lg">
        <p class="text-green-400 font-medium">✓ Meme caricato con successo!</p>
      </div>

      <!-- Alert di errore -->
      <div *ngIf="uploadError" class="mb-6 p-4 bg-red-600/20 border border-red-600 rounded-lg">
        <p class="text-red-400 font-medium">✗ {{ uploadError }}</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        
        <!-- Campo Titolo -->
        <div class="mb-6">
          <label for="titolo" class="block text-sm font-medium text-gray-300 mb-2">
            Titolo del Meme *
          </label>
          <input
            type="text"
            id="titolo"
            [(ngModel)]="titolo"
            name="titolo"
            required
            maxlength="100"
            placeholder="Es: Quando finalmente è venerdì..."
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
        </div>

        <!-- Upload Immagine -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-300 mb-2">
            Immagine del Meme *
          </label>
          
          <div class="border-2 border-dashed border-gray-600 rounded-lg p-6 text-center hover:border-blue-500 transition-colors cursor-pointer"
               (click)="fileInput.click()"
               (dragover)="onDragOver($event)"
               (drop)="onDrop($event)">
            
            <input
              #fileInput
              type="file"
              (change)="onFileSelected($event)"
              accept="image/*"
              class="hidden">

            <div *ngIf="!selectedFile">
              <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <p class="mt-2 text-sm text-gray-400">
                Clicca per selezionare o trascina qui un'immagine
              </p>
              <p class="text-xs text-gray-500 mt-1">PNG, JPG, GIF fino a 10MB</p>
            </div>

            <div *ngIf="selectedFile" class="space-y-3">
              <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview" class="max-h-64 mx-auto rounded-lg">
              <div class="bg-gray-700 rounded-lg p-3">
                <p class="text-sm font-medium text-white">{{ selectedFile.name }}</p>
                <p class="text-xs text-gray-400">{{ formatFileSize(selectedFile.size) }}</p>
              </div>
              <button
                type="button"
                (click)="removeFile($event)"
                class="text-sm text-red-400 hover:text-red-300">
                Rimuovi immagine
              </button>
            </div>
          </div>
        </div>

        <!-- Tags -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-300 mb-2">
            Tags (opzionale)
          </label>
          
          <div class="flex flex-wrap gap-2 mb-3">
            <span *ngFor="let tag of tags; let i = index"
                  class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-blue-600 text-white">
              {{ tag }}
              <button type="button" (click)="removeTag(i)" class="ml-2 hover:text-red-300">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
              </button>
            </span>
          </div>

          <div class="flex gap-2">
            <input
              type="text"
              [(ngModel)]="newTag"
              name="newTag"
              (keyup.enter)="addTag()"
              placeholder="Aggiungi un tag..."
              maxlength="20"
              class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
            <button
              type="button"
              (click)="addTag()"
              [disabled]="!newTag.trim()"
              class="px-4 py-2 bg-blue-600 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
              Aggiungi
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-2">Premi Invio o clicca "Aggiungi" per aggiungere un tag</p>
        </div>

        <!-- Bottoni -->
        <div class="flex gap-4">
          <button
            type="submit"
            [disabled]="!titolo || !selectedFile || isUploading"
            class="flex-1 bg-green-600 px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="!isUploading">Carica Meme</span>
            <span *ngIf="isUploading">Caricamento...</span>
          </button>

          <button
            type="button"
            (click)="onCancel()"
            [disabled]="isUploading"
            class="px-6 py-3 bg-gray-700 rounded-lg font-bold hover:bg-gray-600 transition disabled:opacity-50 disabled:cursor-not-allowed">
            Annulla
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
