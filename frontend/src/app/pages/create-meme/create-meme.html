<div class="min-h-screen bg-gray-900 text-white p-4 sm:p-6">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-center">Crea un Nuovo Meme</h1>

    <div class="bg-gray-800 rounded-xl border border-gray-700 p-4 sm:p-6 shadow-2xl">

      <form (ngSubmit)="onSubmit()" novalidate>
        
        <!-- Campo Titolo -->
        <div class="mb-5 sm:mb-6">
          <label for="titolo" class="block text-sm font-medium text-gray-300 mb-2">
            Titolo del Meme *
          </label>
          <input
            type="text"
            id="titolo"
            [(ngModel)]="titolo"
            name="titolo"
            required
            maxlength="100"
            placeholder="Es: Quando finalmente è venerdì..."
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 sm:px-4 py-2 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm sm:text-base">
        </div>

        <!-- Upload Immagine -->
        <div class="mb-5 sm:mb-6">
          <label class="block text-sm font-medium text-gray-300 mb-2">
            Immagine del Meme *
          </label>
          
          <div class="border-2 border-dashed border-gray-600 rounded-lg p-4 sm:p-6 text-center hover:border-blue-500 transition-colors cursor-pointer"
               (click)="fileInput.click()"
               (dragover)="onDragOver($event)"
               (drop)="onDrop($event)">
            
            <input
              #fileInput
              type="file"
              (change)="onFileSelected($event)"
              accept=".png,.jpg,.jpeg,image/png,image/jpeg"
              class="hidden">

            <div *ngIf="!selectedFile">
              <svg class="mx-auto h-10 w-10 sm:h-12 sm:w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <p class="mt-2 text-xs sm:text-sm text-gray-400">
                Clicca per selezionare o trascina qui un'immagine
              </p>
              <p class="text-xs text-gray-500 mt-1">PNG, JPG, JPEG fino a 10MB</p>
            </div>

            <div *ngIf="selectedFile" class="space-y-3">
              <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview" class="max-h-48 sm:max-h-64 mx-auto rounded-lg">
              <div class="bg-gray-700 rounded-lg p-2 sm:p-3">
                <p class="text-xs sm:text-sm font-medium text-white truncate">{{ selectedFile.name }}</p>
                <p class="text-xs text-gray-400">{{ formatFileSize(selectedFile.size) }}</p>
              </div>
              <button
                type="button"
                (click)="removeFile($event)"
                class="text-xs sm:text-sm text-red-400 hover:text-red-300">
                Rimuovi immagine
              </button>
            </div>
          </div>
        </div>

        <!-- Tags -->
        <div class="mb-5 sm:mb-6 relative">
          <label class="block text-sm font-medium text-gray-300 mb-2">Tag</label>
          <div class="flex gap-2">
            <input
              type="text"
              [(ngModel)]="newTag"
              (input)="filterTags()" 
              (keydown.enter)="addTag($event)"
              name="newTag"
              placeholder="es. divertente, gatti..."
              class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 sm:px-4 py-2 text-white outline-none focus:ring-2 focus:ring-blue-500 text-sm sm:text-base">
            <button type="button" (click)="addTag()" class="px-3 sm:px-4 py-2 bg-blue-600 rounded-lg text-sm sm:text-base hover:bg-blue-700 transition-colors">
              Aggiungi
            </button>
          </div>

          <ul *ngIf="filteredSuggestions.length > 0" 
              class="absolute z-50 w-full bg-gray-800 border border-gray-700 rounded-lg mt-1 shadow-xl overflow-hidden max-h-48 overflow-y-auto">
            <li *ngFor="let suggestion of filteredSuggestions"
                (click)="selectSuggestion(suggestion)"
                class="px-3 sm:px-4 py-2 hover:bg-blue-600 cursor-pointer text-xs sm:text-sm text-white transition-colors">
              {{ suggestion }}
            </li>
          </ul>

          <div class="flex flex-wrap gap-2 mt-3">
            <span *ngFor="let tag of tags; let i = index" 
                  class="bg-blue-600/20 text-blue-400 px-2 sm:px-3 py-1 rounded-full text-xs sm:text-sm border border-blue-600/30 flex items-center gap-1 sm:gap-2">
              #{{ tag }}
              <button type="button" (click)="removeTag(i)" class="hover:text-white text-base sm:text-lg">&times;</button>
            </span>
          </div>
        </div>

        <!-- Bottoni -->
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
          <button
            type="submit"
            [disabled]="!titolo || !selectedFile || isUploading"
            class="flex-1 bg-green-600 px-4 sm:px-6 py-2.5 sm:py-3 rounded-lg font-bold hover:bg-green-700 transition disabled:opacity-50 disabled:cursor-not-allowed text-sm sm:text-base">
            <span *ngIf="!isUploading">Carica Meme</span>
            <span *ngIf="isUploading">Caricamento...</span>
          </button>

          <button
            type="button"
            (click)="onCancel()"
            [disabled]="isUploading"
            class="px-4 sm:px-6 py-2.5 sm:py-3 bg-gray-700 rounded-lg font-bold hover:bg-gray-600 transition disabled:opacity-50 disabled:cursor-not-allowed text-sm sm:text-base">
            Annulla
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
