<div (click)="goToDetails()" 
      class="bg-gray-800 rounded-lg overflow-hidden shadow-md hover:shadow-blue-500/20 hover:scale-[1.02] transition-all duration-300 cursor-pointer group">
  
  <div class="relative aspect-video bg-gray-700">
    <img [src]="imagePath" [alt]="title" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
      <span class="text-white text-sm font-medium">Vedi Dettagli</span>
    </div>
  </div>

  <div class="p-3">
    <h3 class="text-white font-medium truncate mb-2">{{ title }}</h3>
    
    <!-- Tags -->
    <div *ngIf="tags && tags.length > 0" class="flex flex-wrap gap-1 mb-2">
      <span 
        *ngFor="let tag of tags" 
        class="px-2 py-0.5 bg-gray-700 text-gray-300 text-xs rounded-full">
        #{{ tag }}
      </span>
    </div>
    
    <div class="flex justify-between items-center">
      <span class="text-xs text-gray-400">@{{ author }}</span>
      
      <div class="flex items-center gap-2">
        <span class="flex items-center gap-0.5 text-xs text-green-500">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd"></path>
          </svg>
          {{ upvotes }}
        </span>
        
        <span class="flex items-center gap-0.5 text-xs text-red-500">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
          {{ downvotes }}
        </span>
      </div>
    </div>
  </div>
</div>
