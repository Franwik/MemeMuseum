<div class="max-w-3xl mx-auto mb-8 sm:mb-12 lg:mb-16 px-4 sm:px-0">
  <form (ngSubmit)="handleSearch()" class="flex flex-col gap-3">
    <!-- Search input row -->
    <div class="flex flex-col sm:flex-row gap-3">
      <div class="flex-grow relative">
        <input 
          type="text" 
          [(ngModel)]="query"
          name="search"
          placeholder="Cerca meme..."
          data-testid="search-input"
          class="w-full px-4 sm:px-6 py-3 sm:py-4 bg-gray-800 text-white rounded-lg border border-gray-700 focus:border-blue-500 focus:outline-none transition-all text-sm sm:text-base">
      </div>

      <div class="relative flex gap-2 sm:gap-3">
        <input 
          type="date" 
          [(ngModel)]="searchDate"
          name="searchDate"
          class="flex-1 sm:flex-none px-3 sm:px-4 py-3 sm:py-4 bg-gray-800 text-white rounded-lg border border-gray-700 focus:border-blue-500 focus:outline-none transition-all cursor-pointer text-sm sm:text-base">
        
        <button 
          type="submit"
          class="flex-1 sm:flex-none px-4 sm:px-8 py-3 sm:py-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2 text-sm sm:text-base">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <span class="hidden sm:inline">Cerca</span>
        </button>
      </div>
    </div>
  </form>
</div>
