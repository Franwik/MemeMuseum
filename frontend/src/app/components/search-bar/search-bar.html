<div class="max-w-3xl mx-auto mb-16">
  <form (ngSubmit)="handleSearch()" class="flex flex-col md:flex-row gap-3">
    <div class="flex-grow relative">
      <input 
        type="text" 
        [(ngModel)]="query"
        name="search"
        placeholder="Cerca meme..."
        class="w-full px-6 py-4 bg-gray-800 text-white rounded-lg border border-gray-700 focus:border-blue-500 focus:outline-none transition-all">
    </div>

    <div class="relative">
      <input 
        type="date" 
        [(ngModel)]="searchDate"
        name="searchDate"
        class="px-4 py-4 bg-gray-800 text-white rounded-lg border border-gray-700 focus:border-blue-500 focus:outline-none transition-all cursor-pointer">
    </div>
    
    <button 
      type="submit"
      class="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      Cerca
    </button>
  </form>
</div>
