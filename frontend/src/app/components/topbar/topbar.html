<header class="bg-gray-900 border-b border-gray-700 shadow-sm">
  <nav class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      
      <div class="flex items-center space-x-3">
        <button
          (click)="onHome()"
          class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-sm hover:bg-blue-700 transition-colors duration-200">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
          </svg>
        </button>

        <!-- Bottone Esplora (tutti i meme) -->
        <button
          (click)="onExplore()"
          title="Esplora tutti i meme"
          class="w-10 h-10 bg-gray-800 rounded-lg flex items-center justify-center shadow-sm hover:bg-gray-700 transition-colors duration-200 border border-gray-700">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
          </svg>
        </button>
      </div>

      <div class="absolute left-1/2 transform -translate-x-1/2">
        <h1 class="text-2xl md:text-3xl font-bold text-white">
          Meme Museum
        </h1>
      </div>

      <div class="flex items-center space-x-4">
        
        <ng-container *ngIf="currentUser$ | async as user; else guestMode">
          <div class="flex items-center space-x-4">
            <!-- Bottone Crea Meme (solo se autenticato) -->
            <button
              (click)="onCreateMeme()"
              class="flex items-center space-x-2 px-4 py-2 bg-green-600 rounded-lg hover:bg-green-700 transition-colors duration-200 shadow-sm">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              <span class="text-sm font-medium text-white hidden md:inline">Crea Meme</span>
            </button>

            <div class="flex items-center space-x-2 px-3 py-1 bg-gray-800 rounded-full border border-gray-700">
              <svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
              </svg>
              <span class="text-base font-bold text-white tracking-wide">
                {{ user.username }}
              </span>
            </div>

            <button 
              (click)="onLogout()"
              title="Esci"
              class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-all duration-200">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
            </button>
          </div>
        </ng-container>

        <ng-template #guestMode>
          <button 
            (click)="onLogin()"
            class="px-4 py-2 text-sm font-medium text-gray-200 bg-gray-800 rounded-lg hover:bg-gray-700 transition-colors duration-200">
            Accedi
          </button>

          <button 
            (click)="onRegister()"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors duration-200">
            Registrati
          </button>
        </ng-template>

      </div>
    </div>
  </nav>
</header>
