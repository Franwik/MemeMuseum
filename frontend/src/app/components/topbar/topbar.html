<header class="bg-gray-900 border-b border-gray-700 shadow-sm">
  <nav class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo a sinistra -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-sm">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM7 9a1 1 0 100-2 1 1 0 000 2zm7-1a1 1 0 11-2 0 1 1 0 012 0zm-7.536 5.879a1 1 0 001.415 0 3 3 0 014.242 0 1 1 0 001.415-1.415 5 5 0 00-7.072 0 1 1 0 000 1.415z" clip-rule="evenodd"></path>
          </svg>
        </div>
      </div>

      <!-- Titolo centrale -->
      <div class="absolute left-1/2 transform -translate-x-1/2">
        <h1 class="text-2xl md:text-3xl font-bold text-white">
          Meme Museum
        </h1>
      </div>

      <!-- Bottoni a destra -->
      <div class="flex items-center space-x-3">
        <!-- Bottone Accedi -->
        <button 
          (click)="onLogin()"
          class="px-4 py-2 text-sm font-medium text-gray-200 bg-gray-800 rounded-lg hover:bg-gray-700 transition-colors duration-200">
          Accedi
        </button>

        <!-- Bottone Registrati -->
        <button 
          (click)="onRegister()"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors duration-200">
          Registrati
        </button>
      </div>
    </div>
  </nav>
</header>
