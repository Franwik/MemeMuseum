<div 
  class="bg-gray-800 rounded-lg overflow-hidden shadow-lg hover:shadow-xl transition-shadow duration-300 cursor-pointer hover:ring-2 hover:ring-yellow-500"
  (click)="navigateToDetails()">

  <!-- Badge "Meme del giorno" se isDaily è true -->
  <div *ngIf="isDaily" class="bg-gradient-to-r from-yellow-500 to-orange-500 px-3 sm:px-4 py-2 text-center">
    <span class="text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2">
      <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
      </svg>
      Meme del Giorno
    </span>
  </div>

  <!-- Immagine del meme -->
  <div class="relative bg-gray-700 flex items-center justify-center" style="min-height: 200px; max-height: 500px;">
    <img 
      [src]="imagePath" 
      [alt]="title"
      class="w-full h-auto object-contain max-h-[500px]">
  </div>

  <!-- Info del meme -->
  <div class="p-3 sm:p-4">
    <h3 class="text-base sm:text-lg font-semibold text-white mb-2 sm:mb-3 line-clamp-2">{{ title }}</h3>
    
    <!-- Tags -->
    <div *ngIf="tags && tags.length > 0" class="flex flex-wrap gap-1 sm:gap-2 mb-2 sm:mb-3">
      <span 
        *ngFor="let tag of tags" 
        class="px-2 py-0.5 sm:py-1 bg-gray-700 text-gray-300 text-xs rounded-full">
        #{{ tag }}
      </span>
    </div>
    
    <div class="flex items-center justify-between flex-wrap gap-2">
      <!-- Autore -->
      <span class="flex items-center gap-1 text-xs sm:text-sm text-gray-400 truncate max-w-[140px] sm:max-w-none">
        <svg class="w-3 h-3 sm:w-4 sm:h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
        </svg>
        <span class="truncate">{{ author }}</span>
      </span>
      
      <!-- Upvotes e Downvotes -->
      <div class="flex items-center gap-3 sm:gap-4">
        <!-- Upvotes -->
        <span class="flex items-center gap-0.5 sm:gap-1 text-xs sm:text-sm text-green-500">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd"></path>
          </svg>
          {{ upvotes }}
        </span>
        
        <!-- Downvotes -->
        <span class="flex items-center gap-0.5 sm:gap-1 text-xs sm:text-sm text-red-500">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
          {{ downvotes }}
        </span>
      </div>
    </div>
  </div>
</div>
