<div
  class="fixed z-[100] space-y-2 pointer-events-none 
         right-4 left-4 sm:left-auto sm:right-4 w-auto sm:max-w-md
         flex flex-col items-end
         transition-all duration-300 ease-in-out"
  [style.top]="getDynamicTop()"
>
  <div
    *ngFor="let toast of toasts; trackBy: trackByToastId"
    [@toastAnimation]
    class="pointer-events-auto w-full sm:min-w-80 sm:w-auto
           bg-gray-800 rounded-lg shadow-2xl border-l-4 overflow-hidden
           transform transition-all duration-300"
    [ngClass]="{
      'border-green-500': toast.type === 'success',
      'border-red-500': toast.type === 'error',
      'border-blue-500': toast.type === 'info',
      'border-yellow-500': toast.type === 'warning'
    }"
  >
    <div class="p-3 sm:p-4">
      <div class="flex items-start">
        <div class="flex-shrink-0">
          <svg *ngIf="toast.type === 'success'" class="h-5 w-5 sm:h-6 sm:w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <svg *ngIf="toast.type === 'error'" class="h-5 w-5 sm:h-6 sm:w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>

        <div class="ml-3 flex-1 min-w-0">
          <p class="text-sm font-bold text-gray-100 tracking-tight">
            {{ toast.title }}
          </p>

          <div class="mt-1 flex items-start gap-2">
            <p class="text-xs sm:text-sm text-gray-400 whitespace-pre-line flex-1 break-words">
              {{ toast.message }}
            </p>

            <button
              *ngIf="toast.copyText"
              (click)="copyToClipboard(toast.copyText, toast.id)"
              class="flex-shrink-0 p-1 rounded transition-colors"
              [ngClass]="{'text-green-400': copiedIds.has(toast.id), 'text-gray-500 hover:text-gray-300': !copiedIds.has(toast.id)}"
            >
              <svg *ngIf="!copiedIds.has(toast.id)" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              <svg *ngIf="copiedIds.has(toast.id)" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
            </button>
          </div>
        </div>

        <button (click)="removeToast(toast.id)" class="ml-3 flex-shrink-0 text-gray-500 hover:text-gray-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
